<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game & Kuis Visual Prinsip Desain (Desktop)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; color: #2c3e50; text-align: center; }
        h2 { color: #34495e; font-size: 1.2rem; margin-bottom: 5px; text-align: center; }
        p#instruction { color: #7f8c8d; font-style: italic; margin-bottom: 20px; text-align: center; max-width: 600px;}

        /* ---- AREA GAME ---- */
        #game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .game-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .palette {
            width: 120px;
            background: #fff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .shape {
            cursor: grab;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 5;
        }
        .shape:active { cursor: grabbing; }
        
        .square { width: 50px; height: 50px; background-color: #3498db; }
        .circle { width: 50px; height: 50px; background-color: #e74c3c; border-radius: 50%; }
        .large-square { width: 80px; height: 80px; background-color: #f1c40f; }
        
        .canvas {
            width: 500px;
            height: 400px;
            background: #fff;
            border: 3px dashed #7f8c8d;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .controls { display: flex; gap: 10px; justify-content: center; }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        
        #btn-check { background-color: #2ecc71; color: white; }
        #btn-check:hover { background-color: #27ae60; }
        #btn-clear { background-color: #e74c3c; color: white; }
        #btn-clear:hover { background-color: #c0392b; }
        #btn-hint { background-color: #f39c12; color: white; }
        #btn-hint:hover { background-color: #d68910; }

        /* Modal TextBox */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
            z-index: 999;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-box h3 { color: #2ecc71; margin-top: 0; }
        .modal-box p { color: #555; line-height: 1.5; }
        #btn-next { background-color: #3498db; color: white; margin-top: 15px; }

        /* ---- AREA KUIS VISUAL ---- */
        #quiz-section { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 650px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .quiz-visual-box { width: 100%; height: 180px; background-color: #f8f9fa; border: 2px solid #e2e8f0; border-radius: 8px; margin: 15px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .quiz-visual-box svg { width: 100%; height: 100%; }
        .quiz-option { background-color: #ecf0f1; border: 2px solid #bdc3c7; padding: 12px; margin: 6px 0; border-radius: 8px; cursor: pointer; width: 100%; text-align: left; transition: 0.2s; box-sizing: border-box; font-size: 0.98rem; }
        .quiz-option:hover:not(:disabled) { background-color: #d5dbdb; }
        .quiz-option.correct { background-color: #2ecc71; color: white; border-color: #27ae60; }
        .quiz-option.wrong { background-color: #e74c3c; color: white; border-color: #c0392b; }
        .quiz-option:disabled { cursor: not-allowed; }
        #quiz-feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; width: 100%; box-sizing: border-box; line-height: 1.5; }
        #quiz-feedback.success { background-color: #d4efdf; color: #1e8449; border: 1px solid #27ae60; }
        #quiz-feedback.error { background-color: #f2d7d5; color: #c0392b; border: 1px solid #e74c3c; }
        #btn-next-quiz { margin-top: 20px; background-color: #3498db; color: white; width: 100%; display: none; }
        
        #result-section { text-align: center; display: none; }
        #result-section h2 { font-size: 2.5rem; color: #2ecc71; }
        #btn-restart { background-color: #f39c12; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Eksplorasi Desain Visual</h1>
    
    <!-- GAME DRAG AND DROP -->
    <div id="game-section">
        <h2 id="level-title">Level 1: Keseimbangan (Balance)</h2>
        <p id="instruction">Tarik tepat 2 objek (bebas) ke dalam kanvas.</p>

        <div class="game-area">
            <div class="palette" id="palette">
                <p style="margin:0; font-size:12px; color:#7f8c8d; text-align:center;">Pilihan Objek</p>
                <div class="shape square" draggable="true" data-type="square"></div>
                <div class="shape circle" draggable="true" data-type="circle"></div>
                <div class="shape large-square" draggable="true" data-type="large-square"></div>
            </div>

            <!-- Kanvas bersih seperti awal -->
            <div class="canvas" id="canvas"></div>
        </div>

        <div class="controls">
            <button id="btn-clear">Bersihkan Kanvas</button>
            <button id="btn-hint">💡 Petunjuk</button>
            <button id="btn-check">Cek Hasil</button>
        </div>
    </div>

    <!-- KUIS INTERAKTIF VISUAL -->
    <div id="quiz-section">
        <h2 id="quiz-title">Uji Pemahaman: Soal 1 / 10</h2>
        <p id="quiz-question" style="text-align: center; margin-bottom: 5px; font-weight: 500;"></p>
        <div class="quiz-visual-box" id="quiz-visual-container"></div>
        <div id="quiz-options-container" style="width: 100%;"></div>
        <div id="quiz-feedback"></div>
        <button id="btn-next-quiz">Soal Selanjutnya ➡️</button>
    </div>

    <!-- HASIL AKHIR -->
    <div id="result-section">
        <h2>🎉 Kuis Selesai! 🎉</h2>
        <p id="final-score">Skor Anda: 0 / 10</p>
        <button id="btn-restart">Main Lagi dari Awal</button>
    </div>

    <!-- MODAL POPUP -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h3 id="modal-heading">Kerja Bagus!</h3>
            <p id="modal-desc"></p>
            <button id="btn-next">Lanjut</button>
        </div>
    </div>

    <script>
        /* =========================================================
           1. LOGIKA GAME DRAG AND DROP (DESKTOP MOUSE EVENTS)
           ========================================================= */
        const levels = [
            {
                title: "Level 1: Keseimbangan (Balance)",
                instruction: "Tarik tepat 2 objek (bebas) ke dalam kanvas. Usahakan posisinya seimbang (kiri-kanan atau atas-bawah).",
                hint: "Cukup tarik 1 Kotak Biru ke kiri dan 1 Lingkaran Merah ke kanan kanvas agar jumlahnya pas 2 objek.",
                validate: (items) => items.length === 2,
                desc: "Keseimbangan memberikan stabilitas visual. Dalam desain, elemen di satu sisi diimbangi oleh bobot visual elemen di sisi lain."
            },
            {
                title: "Level 2: Penekanan (Emphasis)",
                instruction: "Buat titik fokus! Tarik 1 Lingkaran Merah dan 2 Kotak Biru ke dalam kanvas.",
                hint: "Pastikan persis ada 3 objek di kanvas: 1 buah Lingkaran Merah dan 2 buah Kotak Biru.",
                validate: (items) => {
                    const circles = items.filter(i => i.dataset.type === 'circle').length;
                    const squares = items.filter(i => i.dataset.type === 'square').length;
                    return circles === 1 && squares === 2 && items.length === 3;
                },
                desc: "Penekanan menciptakan Focal Point. Objek yang berbeda bentuk/warna akan langsung menarik mata audiens."
            },
            {
                title: "Level 3: Proporsi (Proportion)",
                instruction: "Tarik 1 Kotak Kuning Besar dan 1 Kotak Biru Kecil untuk menunjukkan kontras ukuran.",
                hint: "Hanya butuh 2 objek: Tarik 1 Kotak Kuning Besar dan 1 Kotak Biru Kecil.",
                validate: (items) => {
                    const large = items.filter(i => i.dataset.type === 'large-square').length;
                    const small = items.filter(i => i.dataset.type === 'square').length;
                    return large === 1 && small === 1 && items.length === 2;
                },
                desc: "Proporsi berkaitan dengan rasio ukuran. Perbedaan ukuran menciptakan hierarki visual."
            },
            {
                title: "Level 4: Ritme (Rhythm)",
                instruction: "Buatlah pola pengulangan. Tarik tepat 4 objek dengan bentuk yang sama secara berderet.",
                hint: "Pilih satu jenis objek (misalnya kotak biru saja), lalu tarik sebanyak 4 buah ke dalam kanvas.",
                validate: (items) => {
                    if (items.length !== 4) return false;
                    const firstType = items[0].dataset.type;
                    return items.every(i => i.dataset.type === firstType);
                },
                desc: "Ritme diciptakan melalui pengulangan elemen yang memandu pergerakan mata melintasi desain."
            },
            {
                title: "Level 5: Kesatuan (Gestalt Proximity)",
                instruction: "Tarik 5 objek apa saja ke kanvas. Susun berdekatan agar terlihat sebagai satu kelompok.",
                hint: "Jumlahnya harus pas 5 objek. Bentuknya bebas (boleh campur), yang penting ada 5 di dalam area kanvas.",
                validate: (items) => items.length === 5,
                desc: "Kesatuan memastikan semua elemen terhubung. Objek berdekatan dipersepsikan sebagai kelompok utuh."
            },
            {
                title: "Level 6: Gabungan Kelimanya",
                instruction: "Tantangan Bebas! Tarik minimal 6 objek bervariasi ke kanvas.",
                hint: "Tarik 6 objek atau lebih ke dalam kanvas. Buatlah sekreatif mungkin!",
                validate: (items) => items.length >= 6,
                desc: "Luar Biasa! Desain hebat menggabungkan semua prinsip. Mari uji pemahamanmu di tahap KUIS VISUAL!"
            }
        ];

        let currentLevelIndex = 0;
        const canvas = document.getElementById('canvas');
        const draggables = document.querySelectorAll('.palette .shape');
        let draggedType = null;

        // Desktop Drag dari Palet
        draggables.forEach(d => {
            d.addEventListener('dragstart', e => {
                draggedType = e.target.dataset.type;
                e.dataTransfer.effectAllowed = 'copy';
            });
        });

        canvas.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });

        // Drop ke Kanvas
        canvas.addEventListener('drop', e => {
            e.preventDefault();
            if (!draggedType) return;
            const newShape = document.createElement('div');
            newShape.classList.add('shape', draggedType);
            newShape.dataset.type = draggedType;
            newShape.style.position = 'absolute';
            
            const rect = canvas.getBoundingClientRect();
            let offsetX = draggedType === 'large-square' ? 40 : 25;
            
            newShape.style.left = `${e.clientX - rect.left - offsetX}px`;
            newShape.style.top = `${e.clientY - rect.top - offsetX}px`;

            makeDraggableInsideCanvas(newShape);
            canvas.appendChild(newShape);
            draggedType = null;
        });

        // Mouse Drag khusus di dalam Kanvas (Desktop)
        function makeDraggableInsideCanvas(el) {
            let isDragging = false, startX, startY, initialLeft, initialTop;

            el.addEventListener('mousedown', e => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseInt(el.style.left || 0);
                initialTop = parseInt(el.style.top || 0);
                el.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                el.style.left = `${initialLeft + dx}px`;
                el.style.top = `${initialTop + dy}px`;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    el.style.cursor = 'grab';
                }
            });
        }

        document.getElementById('btn-clear').addEventListener('click', () => { canvas.innerHTML = ''; });
        document.getElementById('btn-hint').addEventListener('click', () => { alert("💡 PETUNJUK:\n\n" + levels[currentLevelIndex].hint); });

        document.getElementById('btn-check').addEventListener('click', () => {
            const items = Array.from(canvas.querySelectorAll('.shape'));
            const data = levels[currentLevelIndex];
            if (data.validate(items)) {
                document.getElementById('modal-heading').textContent = `Level ${currentLevelIndex + 1} Selesai!`;
                document.getElementById('modal-desc').innerHTML = data.desc;
                document.getElementById('btn-next').textContent = currentLevelIndex === levels.length - 1 ? "Lanjut ke Kuis Visual 📝" : "Lanjut ke Level Berikutnya";
                document.getElementById('modal').classList.add('active');
            } else {
                alert("❌ Komposisi belum tepat. Silakan baca instruksi atau gunakan tombol '💡 Petunjuk'!");
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
            canvas.innerHTML = ''; // Bersihkan kanvas
            if (currentLevelIndex < levels.length - 1) {
                currentLevelIndex++; updateLevelUI();
            } else {
                startQuizMode();
            }
        });

        function updateLevelUI() {
            document.getElementById('level-title').textContent = levels[currentLevelIndex].title;
            document.getElementById('instruction').textContent = levels[currentLevelIndex].instruction;
        }
        updateLevelUI();

        /* =========================================================
           2. LOGIKA KUIS VISUAL SVG (10 SOAL LENGKAP)
           ========================================================= */
        const quizData = [
            {
                q: "Sebuah judul merah menyala dan berukuran sangat besar diletakkan di latar gelap. Mata langsung tertuju ke sana. Prinsip apa ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#1e272e"/><text x="250" y="105" fill="#ff4757" font-size="32" font-weight="900" text-anchor="middle">ROCK CONCERT</text><circle cx="250" cy="95" r="70" stroke="#ff4757" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="5 5"/></svg>`,
                opt: ["A. Ritme", "B. Penekanan (Focal Point)", "C. Keseimbangan", "D. Proporsi"],
                ans: 1, exp: "Penekanan (Emphasis) menciptakan titik fokus dengan warna dan ukuran mencolok."
            },
            {
                q: "Item menu dikelompokkan karena jaraknya dekat. Otak kita langsung menangkapnya sebagai satu paket. Prinsip Gestalt apakah ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#fff"/><rect x="40" y="35" width="120" height="16" fill="#2c3e50" rx="3"/><rect x="40" y="58" width="60" height="12" fill="#e74c3c" rx="3"/><rect x="30" y="25" width="140" height="55" stroke="#3498db" stroke-dasharray="4" fill="none" stroke-width="1.5" rx="4"/><rect x="40" y="105" width="120" height="16" fill="#2c3e50" rx="3"/><rect x="40" y="128" width="60" height="12" fill="#e74c3c" rx="3"/><rect x="30" y="95" width="140" height="55" stroke="#3498db" stroke-dasharray="4" fill="none" stroke-width="1.5" rx="4"/><rect x="280" y="35" width="180" height="115" fill="#ecf0f1" rx="6"/><text x="370" y="100" fill="#7f8c8d" font-size="14" text-anchor="middle">Area Terpisah</text></svg>`,
                opt: ["A. Proximity (Kedekatan)", "B. Closure (Penutupan)", "C. Similarity", "D. Continuity"],
                ans: 0, exp: "Gestalt Proximity: Elemen-elemen yang diletakkan berdekatan dipersepsikan sebagai satu kelompok."
            },
            {
                q: "Meskipun lingkarannya terputus, otak kita tetap melihatnya sebagai bentuk utuh. Prinsip Gestalt apakah ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#f8f9fa"/><path d="M 200 90 A 50 50 0 0 1 250 40" stroke="#2c3e50" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M 275 52 A 50 50 0 0 1 300 90" stroke="#2c3e50" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M 290 115 A 50 50 0 0 1 250 140" stroke="#2c3e50" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M 220 132 A 50 50 0 0 1 200 90" stroke="#2c3e50" stroke-width="8" fill="none" stroke-linecap="round"/><text x="250" y="95" fill="#bdc3c7" font-size="12" text-anchor="middle">Otak mengisi celah</text></svg>`,
                opt: ["A. Symmetry", "B. Closure (Penutupan)", "C. Figure/Ground", "D. Rhythm"],
                ans: 1, exp: "Closure terjadi saat otak melengkapi ruang kosong untuk membentuk objek utuh."
            },
            {
                q: "Sebuah kotak besar di kiri diimbangi oleh 3 kotak kecil di kanan, membuat komposisi terasa stabil. Prinsip apakah ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#fff"/><line x1="250" y1="20" x2="250" y2="160" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/><rect x="70" y="40" width="100" height="100" fill="#3498db" rx="6"/><rect x="290" y="40" width="40" height="40" fill="#e74c3c" rx="4"/><rect x="345" y="40" width="40" height="40" fill="#f1c40f" rx="4"/><rect x="290" y="95" width="95" height="40" fill="#2ecc71" rx="4"/></svg>`,
                opt: ["A. Keseimbangan Asimetris", "B. Keseimbangan Simetris", "C. Ritme Alami", "D. Proporsi 1:1"],
                ans: 0, exp: "Keseimbangan Asimetris membagi bobot visual secara seimbang tanpa cermin persis."
            },
            {
                q: "Tiga tombol hijau disamping langsung dianggap memiliki fungsi setara. Prinsip Gestalt apakah ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#f8f9fa"/><circle cx="100" cy="90" r="30" fill="#2ecc71"/><circle cx="190" cy="90" r="30" fill="#2ecc71"/><circle cx="280" cy="90" r="30" fill="#2ecc71"/><rect x="360" y="60" width="80" height="60" fill="#95a5a6" rx="6"/></svg>`,
                opt: ["A. Closure", "B. Similarity (Kemiripan)", "C. Proximity", "D. Continuation"],
                ans: 1, exp: "Similarity: Objek dengan bentuk/warna sama dianggap sekelompok atau memiliki fungsi sama."
            },
            {
                q: "Deretan kotak biru dengan jarak yang berulang ini menciptakan alur gerak visual. Prinsip apa ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#fff"/><rect x="40" y="60" width="60" height="60" stroke="#34495e" stroke-width="3" fill="#3498db" rx="4"/><rect x="130" y="60" width="60" height="60" stroke="#34495e" stroke-width="3" fill="#3498db" rx="4"/><rect x="220" y="60" width="60" height="60" stroke="#34495e" stroke-width="3" fill="#3498db" rx="4"/><rect x="310" y="60" width="60" height="60" stroke="#34495e" stroke-width="3" fill="#3498db" rx="4"/><rect x="400" y="60" width="60" height="60" stroke="#34495e" stroke-width="3" fill="#3498db" rx="4"/><path d="M 50 140 Q 250 160 450 140" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="4"/></svg>`,
                opt: ["A. Penekanan", "B. Ritme / Pengulangan", "C. Kontras", "D. Proporsi"],
                ans: 1, exp: "Ritme tercipta dari pengulangan elemen untuk memandu pergerakan mata."
            },
            {
                q: "Mata kita mengikuti garis lengkung hingga sampai di tombol DAFTAR. Prinsip Gestalt apakah ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#f8f9fa"/><path d="M 40 140 C 150 20, 250 160, 370 90" stroke="#3498db" stroke-width="5" fill="none" stroke-linecap="round"/><polygon points="365,75 390,92 365,105" fill="#3498db"/><rect x="360" y="65" width="100" height="50" fill="#2ecc71" rx="8"/><text x="410" y="95" fill="#fff" font-weight="bold" font-size="14" text-anchor="middle">DAFTAR</text></svg>`,
                opt: ["A. Continuity (Keberlanjutan)", "B. Proximity", "C. Closure", "D. Balance"],
                ans: 0, exp: "Gestalt Continuity adalah alur kelancaran mata untuk mengikuti arah elemen grafis yang menyambung."
            },
            {
                q: "Desain karakter ini membesarkan bagian kepala dibanding badan untuk kesan imut. Prinsip apa yang diatur di sini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#fff"/><circle cx="200" cy="80" r="50" fill="#f1c40f" stroke="#d35400" stroke-width="3"/><rect x="180" y="130" width="40" height="40" fill="#e74c3c" rx="4"/><line x1="270" y1="30" x2="270" y2="130" stroke="#e74c3c" stroke-width="2"/><text x="340" y="85" fill="#c0392b" font-weight="bold" font-size="14">Kepala (Besar)</text><line x1="270" y1="130" x2="270" y2="170" stroke="#3498db" stroke-width="2"/><text x="340" y="155" fill="#2980b9" font-weight="bold" font-size="14">Badan (Kecil)</text></svg>`,
                opt: ["A. Proporsi & Skala", "B. Keseimbangan", "C. Ritme", "D. Kesatuan"],
                ans: 0, exp: "Proporsi dan skala mengatur rasio perbandingan ukuran antar-elemen."
            },
            {
                q: "Hitam yang gelap melawan putih yang sangat terang. Prinsip apa yang diterapkan di sini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#000"/><text x="250" y="100" fill="#fff" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="4">KONTRAS TINGGI</text></svg>`,
                opt: ["A. Kontras", "B. Proporsi", "C. Proximity", "D. Repetisi"],
                ans: 0, exp: "Kontras (gelap vs terang) memastikan tulisan/pesan utama terlihat sangat jelas."
            },
            {
                q: "Saat warna, bentuk, dan tata letak berpadu melahirkan desain yang utuh. Prinsip tertinggi desain apakah ini?",
                visual: `<svg viewBox="0 0 500 180"><rect width="500" height="180" fill="#ebf5fb"/><circle cx="100" cy="90" r="45" fill="#3498db" opacity="0.7"/><rect x="170" y="55" width="230" height="20" fill="#2c3e50" rx="4"/><rect x="170" y="85" width="180" height="12" fill="#7f8c8d" rx="3"/><rect x="170" y="105" width="140" height="12" fill="#7f8c8d" rx="3"/><rect x="360" y="115" width="100" height="35" fill="#2ecc71" rx="6"/><text x="410" y="137" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">HARMONI</text></svg>`,
                opt: ["A. Kesatuan (Unity / Harmony)", "B. Penekanan", "C. Ritme", "D. Proporsi"],
                ans: 0, exp: "Kesatuan (Unity) merupakan harmoni di mana seluruh elemen saling melengkapi membentuk karya utuh."
            }
        ];

        let currentQuizIndex = 0; let quizScore = 0;

        function startQuizMode() {
            document.getElementById('game-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'flex';
            document.querySelector('h1').textContent = "Kuis Teori Visual Gestalt";
            renderQuiz();
        }

        function renderQuiz() {
            const data = quizData[currentQuizIndex];
            document.getElementById('quiz-title').textContent = `Uji Pemahaman: Soal ${currentQuizIndex + 1} / 10`;
            document.getElementById('quiz-question').textContent = data.q;
            document.getElementById('quiz-visual-container').innerHTML = data.visual;
            
            const optsContainer = document.getElementById('quiz-options-container');
            optsContainer.innerHTML = '';
            document.getElementById('quiz-feedback').style.display = 'none';
            document.getElementById('btn-next-quiz').style.display = 'none';

            data.opt.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option'; btn.textContent = opt;
                btn.onclick = () => checkAns(idx, btn, data);
                optsContainer.appendChild(btn);
            });
        }

        function checkAns(idx, btn, data) {
            const isCorrect = idx === data.ans;
            const fb = document.getElementById('quiz-feedback');
            
            document.querySelectorAll('.quiz-option').forEach((b, i) => {
                b.disabled = true;
                if(i === data.ans) b.classList.add('correct');
            });
            
            if(isCorrect) { 
                quizScore++; 
                fb.className = 'success'; fb.innerHTML = `<strong>Benar! 🎉</strong><br>${data.exp}`; 
            } else { 
                btn.classList.add('wrong'); 
                fb.className = 'error'; fb.innerHTML = `<strong>Kurang tepat. 💡</strong><br>${data.exp}`; 
            }
            
            fb.style.display = 'block';
            document.getElementById('btn-next-quiz').textContent = (currentQuizIndex === quizData.length - 1) ? "Lihat Hasil Akhir 🏆" : "Soal Selanjutnya ➡️";
            document.getElementById('btn-next-quiz').style.display = 'block';
        }

        document.getElementById('btn-next-quiz').addEventListener('click', () => {
            if (currentQuizIndex < quizData.length - 1) { 
                currentQuizIndex++; renderQuiz(); 
            } else { 
                document.getElementById('quiz-section').style.display = 'none';
                document.getElementById('result-section').style.display = 'block';
                document.getElementById('final-score').textContent = `Skor Anda: ${quizScore} / 10`;
                document.querySelector('h1').textContent = "Pelajaran Selesai!";
            }
        });

        document.getElementById('btn-restart').addEventListener('click', () => { location.reload(); });

    </script>
</body>
</html>
